<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <!-- Primary Meta Tags -->
  <title>Chomptron - AI-Powered Recipe Generator</title>
  <meta name="title" content="Chomptron - AI-Powered Recipe Generator" />
  <meta name="description"
    content="Turn your ingredients into delicious recipes with AI. Chomptron uses Google Gemini AI to create personalized recipes from whatever you have in your kitchen. Built by Joseph Swanson." />
  <meta name="keywords"
    content="AI recipe generator, recipe app, cooking assistant, ingredient-based recipes, Gemini AI, Google Cloud, Joseph Swanson, chomptron, AI cooking, recipe maker, meal planner" />
  <meta name="author" content="Joseph Swanson" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />
  <meta http-equiv="Content-Language" content="en-US" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://chomptron.com" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://chomptron.com" />
  <meta property="og:title" content="Chomptron - AI-Powered Recipe Generator" />
  <meta property="og:description"
    content="Turn your ingredients into delicious recipes with AI. Chomptron uses Google Gemini AI to create personalized recipes from whatever you have in your kitchen." />
  <meta property="og:image" content="https://chomptron.com/chomptron_512x512.png" />
  <meta property="og:site_name" content="Chomptron" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://chomptron.com" />
  <meta property="twitter:title" content="Chomptron - AI-Powered Recipe Generator" />
  <meta property="twitter:description"
    content="Turn your ingredients into delicious recipes with AI. Chomptron uses Google Gemini AI to create personalized recipes from whatever you have in your kitchen." />
  <meta property="twitter:image" content="https://chomptron.com/chomptron_512x512.png" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="//chomptron.com" />

  <!-- PWA Support -->
  <link rel="apple-touch-icon" href="/chomptron_192x192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Structured Data -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Chomptron",
        "url": "https://chomptron.com",
        "description": "AI-Powered Recipe Generator using Google Gemini AI",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Joseph Swanson"
        },
        "creator": {
          "@type": "Person",
          "name": "Joseph Swanson"
        }
      }
    </script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Theme Toggle Button -->
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
    🌙
  </button>

  <!-- History Toggle Button -->
  <button class="history-toggle" onclick="toggleHistory()" title="Recipe History">
    🍳
  </button>

  <!-- History Backdrop -->
  <div id="historyBackdrop" class="history-backdrop" onclick="toggleHistory()"></div>

  <!-- History Panel -->
  <div id="historyPanel" class="history-panel">
    <div class="history-header">
      <h3>Recipe History</h3>
      <button class="close-history" onclick="toggleHistory()">✕</button>
    </div>
    <div class="history-controls">
      <input type="text" id="historySearch" class="history-search" placeholder="Search recipes..."
        oninput="filterHistory()" />
      <div class="history-buttons">
        <button onclick="showFavorites()">⭐ Favorites</button>
        <button onclick="showAllHistory()">📋 All</button>
      </div>
      <div class="history-buttons" style="margin-top: 10px;">
        <button onclick="exportRecipes()">💾 Export</button>
        <button onclick="clearHistory()">🗑️ Clear</button>
      </div>
    </div>
    <div id="historyList"></div>
  </div>

  <div class="container">
    <header>
      <div class="header-wrapper">
        <div class="title-background">chomp tron dot com</div>
        <img src="/chomptron.png" alt="Chomptron Logo" class="logo" />
      </div>
      <p class="tagline">Turn Your Ingredients Into Delicious Recipes</p>
    </header>

    <main>
      <div class="input-section">
        <h2>What's in Your Kitchen?</h2>
        <textarea id="ingredients"
          placeholder="Enter your ingredients (e.g., chicken, tomatoes, garlic, pasta, olive oil)" rows="5"></textarea>

        <!-- Dietary Preferences Dropdown -->
        <div class="dietary-dropdown">
          <button type="button" class="dietary-toggle" onclick="toggleDietaryDropdown()">
            🥗 Dietary Preferences & Allergies <span id="dietaryCount">(Optional)</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <div id="dietaryOptions" class="dietary-options hidden">
            <div class="dietary-checkboxes">
              <label><input type="checkbox" id="diet-vegan" value="vegan" onchange="updateDietaryCount()"> 🌱
                Vegan</label>
              <label><input type="checkbox" id="diet-vegetarian" value="vegetarian" onchange="updateDietaryCount()"> 🥬
                Vegetarian</label>
              <label><input type="checkbox" id="diet-glutenFree" value="glutenFree" onchange="updateDietaryCount()"> 🌾
                Gluten-Free</label>
              <label><input type="checkbox" id="diet-dairyFree" value="dairyFree" onchange="updateDietaryCount()"> 🥛
                Dairy-Free</label>
              <label><input type="checkbox" id="diet-nutFree" value="nutFree" onchange="updateDietaryCount()"> 🥜
                Nut-Free</label>
              <label><input type="checkbox" id="diet-shellfishFree" value="shellfishFree"
                  onchange="updateDietaryCount()"> 🦐 Shellfish-Free</label>
              <label><input type="checkbox" id="diet-eggFree" value="eggFree" onchange="updateDietaryCount()"> 🥚
                Egg-Free</label>
              <label><input type="checkbox" id="diet-soyFree" value="soyFree" onchange="updateDietaryCount()"> 🫘
                Soy-Free</label>
            </div>
          </div>
        </div>

        <button id="generateBtn" onclick="generateRecipe()">
          Generate Recipe ✨
        </button>
      </div>

      <div id="loadingIndicator" class="loading hidden">
        <div class="spinner"></div>
        <p>Cooking up something delicious...</p>
      </div>

      <div id="recipeOutput" class="recipe-output hidden">
        <div class="recipe-header">
          <h2>Your Recipe</h2>
          <div class="recipe-header-actions">
            <button id="favoriteBtn" class="favorite-toggle-btn" onclick="toggleFavorite()" title="Add to favorites">
              ☆ Favorite
            </button>
            <button onclick="printRecipe()" class="print-btn" title="Print recipe">🖨️ Print</button>
            <button onclick="shareRecipe()" class="share-btn" title="Share recipe">🔗 Share</button>
          </div>
        </div>

        <!-- Recipe Scaling -->
        <div class="recipe-scaling">
          <label>Servings: </label>
          <button onclick="adjustServings(-1)" class="scale-btn">−</button>
          <span id="servingMultiplier">1x</span>
          <button onclick="adjustServings(1)" class="scale-btn">+</button>
          <span id="servingCount" class="serving-info"></span>
        </div>

        <!-- Recipe Rating -->
        <div class="recipe-rating">
          <label>Rate this recipe: </label>
          <div class="stars">
            <span onclick="rateRecipe(1)" class="star">☆</span>
            <span onclick="rateRecipe(2)" class="star">☆</span>
            <span onclick="rateRecipe(3)" class="star">☆</span>
            <span onclick="rateRecipe(4)" class="star">☆</span>
            <span onclick="rateRecipe(5)" class="star">☆</span>
          </div>
        </div>

        <div id="recipeContent" class="recipe-content-structured"></div>
        <div class="recipe-actions">
          <button onclick="copyRecipe(event)">Copy Recipe 📋</button>
          <button onclick="clearRecipe()">Generate Another Recipe</button>
        </div>
      </div>

      <div id="errorMessage" class="error hidden"></div>
    </main>

    <footer>
      <p>
        Powered by Google Gemini AI | Chomptron.com |
        <a href="https://tronswan.com" target="_blank" rel="noopener noreferrer">tronswan.com</a>
      </p>
    </footer>
  </div>

  <script src="app.js" defer></script>

</body>

</html>

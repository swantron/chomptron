name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format -- --check

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Build + push a fresh image from this commit. Without this, deploy.sh only
      # ships the pre-existing :latest tag (the Cloud Build trigger isn't wired),
      # so code changes never reached production.
      - name: Build and push image
        run: gcloud builds submit --config cloudbuild.yaml --substitutions SHORT_SHA=${GITHUB_SHA::7} .

      - name: Deploy to Cloud Run
        run: ./deploy.sh

  # Post-deploy gate: drive synthetic traffic at the live URL and fail if the
  # white-box telemetry didn't land in the watchtron control plane. The generous
  # requests/wait that absorb Cloud Run's between-request CPU throttling now live
  # in watchtron's registry (services.yaml -> chomptron.probe), not here.
  verify:
    needs: deploy
    uses: swantron/watchtron/.github/workflows/verify.yml@main
    with:
      service: chomptron
      version: ${{ github.sha }}
    secrets:
      otlp_endpoint: ${{ secrets.WATCHTRON_OTLP_ENDPOINT }}
      token: ${{ secrets.WATCHTRON_TOKEN }}
